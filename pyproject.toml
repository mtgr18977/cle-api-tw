[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apiterm"
version = "0.1.0"
description = "Terminology (CLE) extraction from OpenAPI documentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "spacy>=3.7"]

[project.optional-dependencies]
app = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "python-multipart>=0.0.9"]

[project.scripts]
apiterm = "apiterm.cli:main"

[tool.setuptools.packages.find]
include = ["apiterm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
